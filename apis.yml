aid: 01health
name: 01health
description: >-
  01Health is a UK-based health technology company building clinical infrastructure that lets
  specialist healthcare be delivered safely inside community and dental clinics rather than only in
  hospitals. Founded in 2022 by Dr Sonia Szamocki, its platform centralizes patient acquisition,
  clinical protocols, remote specialist oversight, treatment workflows, procurement, and financial
  management into a single system, currently spanning orthodontics (32Co) and sleep medicine (Aerox).
  01Health is backed by Balderton Capital, Gresham House Ventures, Eka Ventures, and Wavemaker360. No
  public developer API, OpenAPI, or developer portal has been published to date; this profile captures
  the company identity and the security posture of its public web surface.
